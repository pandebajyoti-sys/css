<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN PAGE</title>
    <style>
        body{
            font-family: algerian;
            background-color: #0e0909;
            margin:0;
            padding:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;

    }
    .Card{
        background-color: #d1d0d0;
        width: 400px;
        padding: 30px;
        border-radius: 10px;

    }
    button{
        width: 100%;
        padding: 10px;
        background-color: #3e5c92;
        color: white;
        border: 5px;
    }

    button:hover{
        background-color: #0b2658;
        cursor: pointer;
    }
    h2{
        text-align: center;
        color: #530d0d;
    }

    form{
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    input{
         margin-bottom: 10px;
         padding: 10px;
         border: 1px solid #0e0b0b;
         border-radius: 6px;
    }

    </style>
</head>
<body>
    <div class="Card">
        <h2>LOGIN</h2>
       <form>
           <input type="email" name="" id="" placeholder="email">
           <input type="password" name="" id="" placeholder="password">
           <button type="submit">LOGIN</button>
        </form>
    </div>
    
</body>
</html>
